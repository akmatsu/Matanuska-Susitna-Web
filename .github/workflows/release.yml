name: Release

# A version tag only records a release. It does not deploy anything: each
# site already deployed when its changes were merged into main.
#
# To cut a release:
#   git tag -a v1.31.0 -m "short summary" origin/main
#   git push origin v1.31.0
# Don't create the release in the GitHub UI as well. This workflow creates it,
# and the job fails if a release with that tag already exists.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the next step can compare the tag against main.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag on a commit that isn't in main would describe code that was
      # never deployed, so stop here instead of publishing it.
      - name: Check the tag is on main
        run: git merge-base --is-ancestor HEAD origin/main

      # GitHub builds the notes from the pull requests merged since the
      # previous release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
